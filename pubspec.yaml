name: individual_project_atl
description: "Gym Progress & Trainer Allocation System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.2.1

  # State Management
  provider: ^6.1.2

  # Offline Cache
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
